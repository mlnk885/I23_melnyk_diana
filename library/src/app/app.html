<div class="container">
  <h1>Моя бібліотека</h1>

  <div class="form">
    <h2>Додати книгу</h2>

    <input
      type="text"
      placeholder="Назва книги"
      [(ngModel)]="newBook.title"
    />

    <input
      type="text"
      placeholder="Автор"
      [(ngModel)]="newBook.author"
    />

    <input
      type="number"
      placeholder="Кількість сторінок"
      [(ngModel)]="newBook.pages"
    />

    <button
      (click)="addBook()"
      [disabled]="!newBook.title.trim() || !newBook.author.trim()"
    >
      Додати книгу
    </button>
  </div>

  <div class="books">
    <div class="book" *ngFor="let book of books">
      <h2>{{ book.title }}</h2>

      <p>Автор: {{ book.author }}</p>

      <p>Сторінок: {{ book.pages }}</p>

      <button (click)="deleteBook(book.id)">
        Видалити
      </button>
    </div>
  </div>
</div>
